[package]
name = "wren-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wren, re-implemented in Rust for microcontrollers"
repository = "https://github.com/ldm/wren-rs"
categories = ["no-std", "embedded", "compilers"]
keywords = ["wren", "scripting", "embedded", "interpreter"]

[lib]
name = "wren"

# **No dependencies, and that is a design constraint rather than an accident.**
# The point of this crate is that a firmware can `cargo add` it without pulling a
# C toolchain or a tree of crates behind it. Anything added here has to be paid
# for in flash on a part with 62 KB of it.
[dependencies]

[features]
default = ["std"]
# `std` is for the host: tests, and eventually an ahead-of-time compiler that
# runs on a workstation and emits bytecode for a part that cannot afford one.
# Firmware builds turn it off.
std = []

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
