# The workspace root. **It carries no code of its own.**
#
# `crates/wren` is the deliverable: a standalone package somebody can depend on
# without taking the rest of this repository with them. Everything else here --
# the C reference port, the benchmark harnesses, the vendored upstream -- exists
# to measure that crate, not to be shipped with it.
[workspace]
resolver = "2"
members = ["crates/wren"]
# The ports build for other targets and carry their own profiles; they are
# their own workspaces.
exclude = ["ports"]

# Applied to every member. A part with 62 KB of flash cannot afford the default
# release profile's inlining, and `panic = "abort"` removes the unwinder, which
# is several kilobytes that a microcontroller has no use for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
