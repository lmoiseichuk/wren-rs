# The Rust VM on an ESP32-C6, running bytecode, with no compiler linked.
#
# **Bare metal, not ESP-IDF.** The C port in `../esp32c6-wren` is an ESP-IDF
# application because upstream Wren is a C library that expects a libc; this
# crate is `no_std` by design, so going through ESP-IDF would add a layer it
# does not need and measure that layer's start-up and heap alongside the VM's.
#
# The dependencies here are the port's, not the library's. `crates/wren` still
# has none, which is the point -- a firmware takes the VM without taking a tree
# of crates with it.
[package]
name = "esp32c6-wrenc-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# **Its own workspace, deliberately.** This builds for a different target with
# its own profiles, and sweeping it into the root workspace would put a
# bare-metal firmware into `cargo test` at the top level.
[workspace]

[features]
# **32-bit numbers.** Not Wren -- see `crates/wren`'s own `f32` feature and
# `doc/wren-rs/design.md`. Built here so the cost and the saving can be
# measured on the part rather than argued about.
# **`main.rs` needs the whole core and `uwren.rs` does not**, and a cargo
# feature is resolved per package rather than per binary -- so the default
# carries the full core for the benchmark runner, and the tailored image is
# `cargo build --bin uwren --no-default-features`. That is the build the
# footprint numbers in `doc/wren-rs/memory.md` come from.
default = ["core_full"]
core_full = ["wren/core_full"]
# **Asking the built VM what it is holding.** Adds the breakdown `uwren` prints
# after construction; off by default because a shipping image should not carry
# the arithmetic or the strings.
census = ["wren/census"]
f32 = ["wren/f32"]

[dependencies]
# **No `compiler` feature**, which is the whole point of this port: the device
# is handed `.wrenc` built on a workstation, so the lexer and the parser are
# never linked. What this package measures is how much of the firmware they
# were.
wren = { path = "../../crates/wren", default-features = false, features = ["uwren"] }
esp-hal = { version = "1.2", features = ["esp32c6", "unstable"] }
esp-alloc = { version = "0.11", features = ["esp32c6"] }
esp-println = { version = "0.16", features = ["esp32c6"] }
esp-backtrace = { version = "0.18", features = ["esp32c6", "panic-handler", "println"] }
# The chip's second-stage bootloader expects an app descriptor at a fixed
# offset, even in an application that uses none of ESP-IDF otherwise.

# **Two profiles, matching the two the C port publishes.** `-Os` and `-O2` are
# the compiler flags that produced those numbers; `opt-level = "z"` and
# `opt-level = 3` are the nearest equivalents here, and both are built from the
# same source so the difference is the optimiser's alone.
[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.speed]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
