[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor"
# **esp-hal supplies the memory map.** `linkall.x` is the script that places
# the vectors, the text and the data regions for the chip; without it the
# link fails on the symbols the runtime expects the map to define.
rustflags = [
    "-C", "link-arg=-Tlinkall.x",
    # **The app descriptor is referenced by nothing**, so `--gc-sections`
    # drops it and the flashing tool then refuses the image for not having
    # one. Naming it as an undefined symbol keeps it.
    "-C", "link-arg=--undefined=esp_app_desc",
    # **Pad every branch target to four bytes.** The interpreter's inner loop
    # was read as instruction-fetch bound on this part, and this is the
    # cheapest thing that relieves it: measured on an ESP32-C6FH4 at 80 MHz
    # (the clock esp-hal defaulted to; the note once said 160), `binary_trees`
    # 9.007 -> 8.729 s and `fib` 16.774 -> 16.127 at `-O3`, and 17.189 ->
    # 16.587 and 33.367 -> 32.448 at `-Os`. Three to four per cent on every
    # benchmark, for 6,640 B of flash at `-O3` and 2,880 B at `-Os`, and no
    # RAM at all -- which is the resource that decides what this project can
    # run on.
    #
    # **Four bytes, not more.** 8 B and 16 B land within 0.3% of this for
    # three and seven times the flash; 2 B is a no-op, because compressed
    # instructions already force that alignment and the image comes out
    # byte-identical.
    #
    # `-Cllvm-args` reaches into LLVM rather than going through a rustc option,
    # because rustc has none for this -- and `#[repr(align)]` on a function,
    # which would let it be aimed at `run_frames` alone, does not exist on
    # stable. Aiming it there would not help much anyway: aligning function
    # *entries* is worth 0.12%, because what matters is the branch targets
    # inside the loop.
    "-C", "llvm-args=-align-all-nofallthru-blocks=2",
    # **No constant hoisting.** A `Value` is a `u64`, which on a 32-bit core is
    # two registers, and LLVM's constant-hoisting pass keeps one 64-bit tag
    # constant live and rebuilds its neighbours from it -- `QNAN` as
    # `(QNAN | 1) - 1`, a borrow carried between the halves -- inside every
    # type test on the hot path: `li`, `seqz`, `addi -1`, `sub` before the
    # mask, twice per arithmetic call. Without the pass each constant is two
    # instructions where it is used. At 160 MHz, same source:
    #
    #   work  binary_trees -1.82%  fib -5.01%  list_build -1.73%  method_call -2.26%
    #   time               -1.04%      -2.89%             -1.08%              -1.27%
    #
    # identical at branch padding 4 and 8, for 464 B of flash. Writing the
    # test on the high word in the source does not help: InstCombine widens
    # it straight back to the 64-bit form.
    "-C", "llvm-args=-disable-constant-hoisting",
]

[env]
ESP_LOG = "info"
