[package]
name = "wren"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wren, re-implemented in Rust for microcontrollers"
repository = "https://github.com/ldm/wren-rs"
categories = ["no-std", "embedded", "compilers"]
keywords = ["wren", "scripting", "embedded", "interpreter"]
readme = "README.md"
# The lexer is allocation-free and the bytecode reader will be; only the heap
# needs `alloc`. Somebody building for a part with no allocator should still get
# a crate that compiles.
exclude = ["/tests/fixtures"]

[lib]
name = "wren"

# **No dependencies by default, and that is a design constraint rather than an
# accident.** The point of this crate is that a firmware can `cargo add wren`
# without pulling a C toolchain or a tree of crates behind it. Anything added
# here has to be paid for in flash on a part with 62 KB of it.
#
# `libm` is the one exception, and it is optional. Wren's `Num` class has the
# transcendentals -- `sin`, `log`, `pow` -- and upstream gets them from the
# platform's libm; `std` provides them on a host, and a bare-metal target has
# nothing. Writing them here is not the answer: the tests check them to
# fourteen significant digits, which is specialist numerical work that a naive
# series will not reach. `libm` is the Rust port of musl's, so enabling it
# keeps the crate pure Rust while making the two builds agree.
# **The profiler only exists with its counters.** Declaring the requirement
# keeps `cargo clippy --all-targets` and `cargo test` from trying to build it
# in a plain checkout, where `heap::Profile` is not compiled at all.
[[example]]
name = "heap-profile"
required-features = ["profile"]

[[example]]
name = "op-profile"
required-features = ["profile", "std"]

[dependencies]
libm = { version = "0.2", optional = true }

[features]
default = ["std", "compiler"]
# **Slot tables in blocks, so a table can give memory back after a spike.**
# A flat table only grows: freeing a slot returns it to a free list, not to
# the allocator, so a program that builds something large and drops it keeps
# the high-water mark for the rest of its life.
#
# Measured on an ESP32-C6: `binary_trees`' peak falls 115,024 -> 87,632 B, a
# quarter, because the tail of the dropped tree goes back. The other three
# benchmarks pay 1-25% *more*, because a block is 32 slots across ten tables
# and a small program does not fill one. It costs 6-9% of the work
# everywhere, for the indirection on every object access.
#
# Off by default. On for a program that builds something large and then lets
# go of it, on a part where the peak is what runs out.
blocked-slots = []
# `std` is for the host: tests, and eventually an ahead-of-time compiler that
# runs on a workstation and emits bytecode for a part that cannot afford one.
# Firmware builds turn it off and usually turn `alloc` on instead.
std = ["alloc"]
# The object heap needs a growable allocation. A part with no allocator at all
# can still use the lexer and, later, the bytecode reader.
alloc = []
# `Num`'s transcendentals on a target without `std`. Without either, they are
# simply not defined -- which reports "Num does not implement 'sin'" rather
# than answering something wrong.
libm = ["dep:libm"]
# **32-bit numbers, for a part that cannot afford doubles. This is not Wren.**
#
# Wren's `Num` is a double by specification, and every conformance test and
# published benchmark runs that way. Turning this on halves every stack slot,
# list element, instance field and map entry, takes a heap slot from 24 bytes
# to 20 by dropping the enum's alignment, and makes the arithmetic cheaper on a
# part with no FPU.
#
# What it costs is exactness: an `f32` represents integers exactly only to
# 2^24, so a program that counts past 16,777,216 will print something else.
# `doc/wren-rs/design.md` sets out the trade in full.
f32 = []
# **Integers only, no floating point anywhere. This is µwren, not Wren.**
#
# Wren has one numeric type and it is a double. Removing floating point is
# therefore a change to the language, not a narrowing of it -- `1/2` is `0`,
# there are no fractional literals, and `Num` is a 31-bit signed integer
# because one bit pays for the tag that NaN boxing used to get free.
#
# What it buys is the largest saving anywhere in the crate. An `f32` still
# formats and still parses, so it carries Rust's Dragon and Grisu shortest-
# formatting, its `dec2flt` tables and `strtod` with it; integers carry none
# of them, and neither do libm's transcendentals, which cannot be defined.
#
# It is for a part like a CH32V006 -- 62 KB of flash, 8 KB of RAM -- where a
# sensor counts millivolts and percentages and never needed a double.
nofp = []
# **µwren: the whole intent in one word.**
#
# `nofp` on its own is additive, and Cargo has no way for a feature to switch
# another *off* -- so enabling it beside the defaults still drags `std` and
# the compiler in, which is exactly backwards for the part it exists for.
# This names the combination a small target actually wants:
#
#     wren = { default-features = false, features = ["uwren"] }
#
# `no_std`, an allocator, integers only, and no compiler -- a device runs
# bytecode built on a host. Measured on an ESP32-C6 that is 312,340 B of
# image against 373,814 B, and a VM holding 7,036 B rather than 21,060 B once
# its core is tailored to one program's manifest.
uwren = ["alloc", "nofp"]
# **Counters in the collector, for deciding what to replace it with.** Off by
# default and never shipped: it adds a tally to every allocation and, at every
# collection, a refcount simulation over the garbage to work out how much of it
# is cyclic. `cargo run --release --features profile --example heap-profile`.
profile = ["std"]
# **Reference counting in front of the tracing collector. Off, and measured.**
#
# Every heap-to-heap reference is counted and an object whose count reaches
# zero is freed as soon as the roots agree, so most garbage never waits for a
# trace -- 95.8% of reclaims on the benchmark set.
#
# It is off because the measurement says it does not pay on this VM: on an
# ESP32-C6 it costs 18% of `binary_trees` to save 6% of its peak, and 3-5% of
# the other three benchmarks to save nothing. `Heap::set_growth(5, 4)` buys
# more memory than that for a quarter of the time. See
# `doc/wren-rs/design.md`.
refcount = []
# **A nursery, without moving anything.**
#
# Objects already live in slots addressed by a stable index, so a generation
# can be a bitmap over those slots rather than a region of memory. A minor
# collection traces the roots and the remembered set, frees the young slots
# nothing reached, and *promotes* the rest by clearing a bit -- no copying, no
# forwarding, no migration cost.
#
# 84% of what this VM allocates is dead by the next collection, which is what
# makes tracing only the young generation worth the remembered set it needs.
nursery = []
# **The compiler, which a device running bytecode does not need.** This is
# what step 4 of the plan is for: compile on a workstation, ship `.wrenc`, and
# leave the lexer and parser out of the image entirely. Default on, because a
# host almost always wants it.
compiler = []
